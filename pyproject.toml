[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "alterego"
version = "0.1.0"
description = "拟人化生活模拟 Agent —— 一个会自己生活、自己思考、按自己的节奏找你的数字存在"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LMG-arch" }]
keywords = ["agent", "llm", "simulation", "persona", "anthropomorphic", "ai-companion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# ═════════════════════════════════════════════════════════════
# 依赖：极简主义（原则 P5 · Stdlib First）
#
# 只依赖两个无法用标准库替代的包：
#   · pydantic  —— 配置与消息的结构化校验
#   · httpx     —— 异步 HTTP（LLM 调用 + webhook 发送）
#
# 其余全部用标准库：
#   · tomllib   —— TOML 解析（3.11+ 内置）
#   · sqlite3   —— 数据库（内置）
#   · argparse  —— CLI（内置）
#   · asyncio   —— 并发（内置）
#   · logging   —— 日志（内置）
# ═════════════════════════════════════════════════════════════
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Web 界面
web = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]
# 中文分词（强烈推荐）
zh = [
    "jieba>=0.42.1",
]
# 企业微信双向（v2）
wecom = [
    "pycryptodome>=3.20",
]
# 开发工具
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# 全部
all = [
    "alterego[web,zh]",
]

[project.scripts]
alterego = "alterego.cli:main"

[project.urls]
Homepage = "https://github.com/LMG-arch/alter-ego"
Documentation = "https://github.com/LMG-arch/alter-ego/blob/main/docs/DESIGN.md"
Repository = "https://github.com/LMG-arch/alter-ego"
Issues = "https://github.com/LMG-arch/alter-ego/issues"
Changelog = "https://github.com/LMG-arch/alter-ego/blob/main/CHANGELOG.md"

# ═════════════════════════════════════════════════════════════
# 插件入口点：pip 安装的插件通过这里被发现
# 本地插件（plugins/<name>/）优先级更高，无需注册
# ═════════════════════════════════════════════════════════════
[project.entry-points."alterego.plugins"]
# 示例（第三方包提供插件时这样声明）：
# my_channel = "my_package.plugin:MyChannelPlugin"

# ─────────────────────────────────────────────────────────────
# Hatch 打包配置
# ─────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/alterego"]

# 只有 `templates/` 需要映射：它在包目录之外，不映射就会被 wheel 漏掉。
# `src/alterego/` 里的数据文件（`defaults.toml`、`prompts/`、`migrations/`、
# `channels/web/static/`）由上面的 `packages` 自动包含，不要在这儿重复列一遍——
# 重复列意味着目录一改位置 build 就炸。
[tool.hatch.build.targets.wheel.force-include]
"templates" = "alterego/templates"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/templates",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

# ─────────────────────────────────────────────────────────────
# Ruff —— 代码检查与格式化
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "logs",
]
# ⚠️ 只处理 Python 文件。
# 默认的 include 在某些 ruff 版本下会把 Markdown 里的 ```python 代码块
# 也当作可格式化对象——而文档示例是「为可读性刻意排版」的（比如为了让签名
# 一行读完而超出 100 列），自动重排会破坏文档的表达意图。
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez  ← 强制时区正确性（本项目时间敏感）
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "PERF", # perflint
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # 行长由 formatter 控制
    "B008",    # 允许函数调用作为默认参数（FastAPI Depends）
    # ── 以下是本项目的既定中文风格，不是疏忽 ──────────────────
    # RUF001/2/3：全角标点（，。：；（）「」）在中文注释与文案里是正确写法。
    # ruff 认为它们「与 ASCII 混淆」，但本项目所有面向人的文本都是中文，
    # 混用半角反而更难读。见 CONTRIBUTING.md「文档纪律」。
    "RUF001",
    "RUF002",
    "RUF003",
    # N818：异常名不强制 Error 后缀。内核异常树的名字（TickAborted、
    # IntentRejected、LLMBudgetExceeded）已在 docs/design/01-architecture.md
    # § 2.1 定稿，且是文档、日志与 `alterego why` 输出里对用户可见的契约名。
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# 测试中允许硬编码与断言魔法
"tests/**" = ["ARG", "S101", "DTZ", "PLR2004"]
# 架构红线脚本自身不检查
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["alterego"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: 慢测试（> 1s），默认跳过，用 -m slow 运行",
    "integration: 需要外部服务（LLM API / IM webhook）",
    "golden: 可复现性黄金测试（固定种子，输出必须完全一致）",
    "architecture: 架构红线测试（依赖方向检查）",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:jieba.*",
]

[tool.coverage.run]
source = ["src/alterego"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "src/alterego/channels/web/static/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ─────────────────────────────────────────────────────────────
# Mypy —— 渐进式类型检查
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["src/alterego"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["jieba.*", "uvicorn.*", "Crypto.*"]
ignore_missing_imports = true

# 内核层必须是最严格的（原则 P1 · 内核无知）
[[tool.mypy.overrides]]
module = ["alterego.kernel.*"]
disallow_any_explicit = false
disallow_untyped_calls = true
