name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ═══════════════════════════════════════════════════════════
  # 架构红线：先跑最便宜的检查，失败就立刻停
  # 依据 docs/design/01-architecture.md § 1
  # ═══════════════════════════════════════════════════════════
  architecture:
    name: 架构红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查分层依赖方向
        shell: bash
        run: bash scripts/check_architecture.sh --verbose

      - name: 检查内核无具体技术依赖
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d src/alterego/kernel ]]; then
            echo "::group::内核无知检查"
            if grep -rEn 'sqlite|openai|anthropic|wecom|dingtalk|telegram|fastapi|httpx|requests|aiohttp' \
                 src/alterego/kernel/ --include='*.py'; then
              echo "::error::kernel/ 引用了具体技术实现，违反设计原则 P1（内核无知）"
              echo "依据: docs/design/01-architecture.md § 2.1"
              exit 1
            fi
            echo "✓ 内核无具体技术依赖"
            echo "::endgroup::"
          else
            echo "⊘ kernel/ 尚未创建，跳过"
          fi

      - name: 检查文档与代码同步
        shell: bash
        run: |
          set -euo pipefail
          if git log --oneline -1 | grep -q 'skip-doc-check'; then
            echo "⊘ 提交信息包含 skip-doc-check，跳过文档同步检查"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "⊘ 无法确定 base commit，跳过"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 || echo "")
          if echo "$CHANGED" | grep -qE '^src/alterego/'; then
            if echo "$CHANGED" | grep -qE '^(docs/|CHANGELOG\.md)'; then
              echo "✓ 源码变更同时更新了文档"
            else
              echo "::warning::源码有变更但没有更新 docs/ 或 CHANGELOG.md"
              echo "依据: CONTRIBUTING.md § 文档纪律"
              echo "（如确实无需更新文档，在提交信息中加入 skip-doc-check）"
            fi
          else
            echo "⊘ 无源码变更，跳过"
          fi

  # ═══════════════════════════════════════════════════════════
  # 代码检查
  # ═══════════════════════════════════════════════════════════
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    outputs:
      has_src: ${{ steps.guard.outputs.has_src }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 设计阶段（尚无 src/alterego）时，测试与打包作业无事可做。
      # 这里判断一次并作为作业输出，供后续作业用 if 条件跳过，
      # 避免把"还没有源码"当成失败。
      - name: 判断是否已有源码
        id: guard
        run: |
          if [ -d src/alterego ]; then
            echo "has_src=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_src=false" >> "$GITHUB_OUTPUT"
            echo "⊘ 尚无 src/alterego（当前处于设计阶段），测试与打包作业将跳过"
          fi

      - name: 安装 ruff
        run: python -m pip install "ruff>=0.5"

      - name: ruff check
        run: |
          # 只检查 Python 文件。
          # 用 git ls-files 显式取文件，而不是传 "."：
          # ruff 在部分版本下会把 Markdown 里的 ```python 代码块也当作可格式化对象，
          # 而文档里的示例是「为可读性刻意排版」的，不能被自动重排。
          FILES=$(git ls-files '*.py' '*.pyi')
          if [[ -z "$FILES" ]]; then
            echo "⊘ 尚无 Python 文件，跳过"
            exit 0
          fi
          echo "$FILES" | xargs ruff check --output-format=github

      - name: ruff format --check
        run: |
          FILES=$(git ls-files '*.py' '*.pyi')
          if [[ -z "$FILES" ]]; then
            echo "⊘ 尚无 Python 文件，跳过"
            exit 0
          fi
          echo "$FILES" | xargs ruff format --check --diff

      # AGENTS.md § 4 把 `python -m mypy src/alterego` 列为必跑门禁，
      # pyproject.toml 也把它配成 strict —— 但在此之前 CI 里根本没有这一步，
      # 类型错误可以一路合进 main。与覆盖率下限同一类缺陷：文档说了、机制没有。
      # ⚠️ 装 extras 时必须带 `web`：mypy 要能看见 fastapi 才会去检查那些路由函数。
      # 只装 `.[dev]` 时 channels/web/** 会报 35 个 import-not-found + untyped-decorator，
      # 于是这道门禁**永远红**，而它与每一次改动的内容都无关；
      # 本地看不出来，因为开发者的环境里本来就装着 fastapi。
      - name: mypy
        run: |
          if [ ! -d src/alterego ]; then
            echo "⊘ 尚无 src/alterego（当前处于设计阶段），跳过"
            exit 0
          fi
          python -m pip install -e ".[dev,web,zh]"
          python -m mypy src/alterego

      - name: 检查 TOML 可解析
        run: python -c "import glob,tomllib,pathlib; fs=sorted(glob.glob('**/*.toml',recursive=True)); [tomllib.loads(pathlib.Path(f).read_text(encoding='utf-8')) for f in fs]; print('✓ TOML 全部可解析:', ', '.join(fs))"

  # ═══════════════════════════════════════════════════════════
  # 测试矩阵
  # ═══════════════════════════════════════════════════════════
  test:
    name: 测试 (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    if: needs.lint.outputs.has_src == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,zh]"

      - name: 导入检查
        run: python -c "import alterego; print('alterego', getattr(alterego, '__version__', 'dev'))"

      - name: 运行测试
        run: pytest -q --cov=alterego --cov-report=term-missing --cov-report=xml --cov-report=json

      # AGENTS.md § 5 写着四个覆盖率下限「CI 阻断」——在此之前 CI 里只有一个裸的
      # --cov=alterego，没有 fail_under，删光 domain/ 的测试也照样绿。
      - name: 核对覆盖率下限
        run: python scripts/check_coverage.py

      - name: 上传覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════
  # 可复现性黄金测试：只跑一次，但必须逐字节一致
  # ═══════════════════════════════════════════════════════════
  golden:
    name: 可复现性黄金测试
    runs-on: ubuntu-latest
    needs: [lint]
    if: needs.lint.outputs.has_src == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: python -m pip install -e ".[dev]"

      - name: 运行黄金测试
        run: |
          if find tests/golden -name 'test_*.py' 2>/dev/null | head -1 | grep -q .; then
            pytest tests/golden -q -m golden
          else
            echo "⊘ 黄金测试尚未创建，跳过"
          fi

  # ═══════════════════════════════════════════════════════════
  # 打包验证
  # ═══════════════════════════════════════════════════════════
  package:
    name: 打包验证
    runs-on: ubuntu-latest
    needs: [lint]
    if: needs.lint.outputs.has_src == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: python -m pip install --upgrade build

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 检查产物
        run: |
          ls -la dist/
          python -m pip install --force-reinstall dist/*.whl
          alterego --version || alterego --help | head -5

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
