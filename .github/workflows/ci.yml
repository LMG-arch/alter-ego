name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ═══════════════════════════════════════════════════════════
  # 架构红线：先跑最便宜的检查，失败就立刻停
  # 依据 docs/design/01-architecture.md § 1
  # ═══════════════════════════════════════════════════════════
  architecture:
    name: 架构红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查分层依赖方向
        shell: bash
        run: bash scripts/check_architecture.sh --verbose

      - name: 检查内核无具体技术依赖
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d src/alterego/kernel ]]; then
            echo "::group::内核无知检查"
            if grep -rEn 'sqlite|openai|anthropic|wecom|dingtalk|telegram|fastapi|httpx|requests|aiohttp' \
                 src/alterego/kernel/ --include='*.py'; then
              echo "::error::kernel/ 引用了具体技术实现，违反设计原则 P1（内核无知）"
              echo "依据: docs/design/01-architecture.md § 2.1"
              exit 1
            fi
            echo "✓ 内核无具体技术依赖"
            echo "::endgroup::"
          else
            echo "⊘ kernel/ 尚未创建，跳过"
          fi

      - name: 检查文档与代码同步
        shell: bash
        run: |
          set -euo pipefail
          if git log --oneline -1 | grep -q 'skip-doc-check'; then
            echo "⊘ 提交信息包含 skip-doc-check，跳过文档同步检查"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "⊘ 无法确定 base commit，跳过"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 || echo "")
          if echo "$CHANGED" | grep -qE '^src/alterego/'; then
            if echo "$CHANGED" | grep -qE '^(docs/|CHANGELOG\.md)'; then
              echo "✓ 源码变更同时更新了文档"
            else
              echo "::warning::源码有变更但没有更新 docs/ 或 CHANGELOG.md"
              echo "依据: CONTRIBUTING.md § 文档纪律"
              echo "（如确实无需更新文档，在提交信息中加入 skip-doc-check）"
            fi
          else
            echo "⊘ 无源码变更，跳过"
          fi

  # ═══════════════════════════════════════════════════════════
  # 代码检查
  # ═══════════════════════════════════════════════════════════
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装 ruff
        run: python -m pip install "ruff>=0.5"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

      - name: 检查 TOML 可解析
        run: python -c "import tomllib,pathlib; tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print('✓ pyproject.toml 可解析')"

  # ═══════════════════════════════════════════════════════════
  # 测试矩阵
  # ═══════════════════════════════════════════════════════════
  test:
    name: 测试 (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,zh]"

      - name: 导入检查
        run: python -c "import alterego; print('alterego', getattr(alterego, '__version__', 'dev'))"

      - name: 运行测试
        run: pytest -q --cov=alterego --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════
  # 可复现性黄金测试：只跑一次，但必须逐字节一致
  # ═══════════════════════════════════════════════════════════
  golden:
    name: 可复现性黄金测试
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: python -m pip install -e ".[dev]"

      - name: 运行黄金测试
        run: |
          if find tests/golden -name 'test_*.py' 2>/dev/null | head -1 | grep -q .; then
            pytest tests/golden -q -m golden
          else
            echo "⊘ 黄金测试尚未创建，跳过"
          fi

  # ═══════════════════════════════════════════════════════════
  # 打包验证
  # ═══════════════════════════════════════════════════════════
  package:
    name: 打包验证
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: python -m pip install --upgrade build

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 检查产物
        run: |
          ls -la dist/
          python -m pip install --force-reinstall dist/*.whl
          alterego --version || alterego --help | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
