name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "需要分类"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢建议。

        **在填写之前，请先读一下 [`docs/DESIGN.md`](../blob/main/docs/DESIGN.md) 的
        § 3 设计原则与 § 15 非目标** —— 很多想法可能已经在非目标清单里了。

        另外这是一个**插件式架构**的项目：大多数扩展都**不需要改内核**，而是写一个插件。
        如果你的想法能做成插件，请在下面的对应问题中说明。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与 `docs/`，没有重复
          required: true
        - label: 我已读 `DESIGN.md` § 15 非目标，确认这不属于明确的非目标
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: |
        **请先描述问题，而不是直接描述方案。**
        例如：「Agent 从不主动道歉」比「加一个 apology 意图」更有价值——
        后者可能不是最好的解法。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: |
        什么情况下会用到？举一个具体的例子。
        例如：「当我连续 3 天没回复它，第 4 天它应该……」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
      description: 如果你有具体的实现想法，写在这里。没有也没关系。
    validations:
      required: false

  - type: dropdown
    id: can_be_plugin
    attributes:
      label: 这个功能能作为插件实现吗？
      description: 见 `docs/design/02-plugin-api.md` 的六类插件
      options:
        - 能 —— 作为新插件（llm / storage / channel / capability / stage / tool）
        - 能 —— 作为新的 IntentType（意图类型）
        - 能 —— 作为新的推演阶段（Stage）
        - 不能 —— 需要修改内核
        - 不确定
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > 💡 **如果答案是「不能，需要修改内核」，请特别说明理由。**
        > 依据设计原则 P1（内核无知）与 P4（可插拔优于可配置），
        > 需要改内核的扩展会被严格审视——通常说明抽象层设计得不够好。

  - type: dropdown
    id: principle
    attributes:
      label: 主要影响哪条设计原则？
      options:
        - 不冲突
        - P1 内核无知
        - P2 显式优于隐式
        - P3 机制约束优于提示词祈祷
        - P4 可插拔优于可配置
        - P5 标准库优先
        - P6 可复现
        - P7 文档与代码同生共死
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你还想过哪些做法？为什么放弃？
    validations:
      required: false

  - type: dropdown
    id: cost_impact
    attributes:
      label: 对 LLM 成本的影响
      description: 当前典型成本约 $7.5/月
      options:
        - 无影响（纯本地计算）
        - 很小（增加 < 10%）
        - 中等（增加 10%–50%）
        - 很大（增加 > 50%）
        - 能降低成本
        - 不确定
    validations:
      required: false

  - type: dropdown
    id: willingness
    attributes:
      label: 你愿意提交 PR 吗？
      options:
        - 愿意，我可以实现
        - 愿意，但我需要指导
        - 不愿意，只是提出建议
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考链接、草图、其他项目的做法等
    validations:
      required: false
