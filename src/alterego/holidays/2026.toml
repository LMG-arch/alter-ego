# 2026 年节日日历
#
# ────────────────────────────────────────────────────────────
# 这份数据有三个**性质完全不同**的来源，不要把它们混为一谈：
#
#   1. 放假**天数** —— 法条。《全国年节及纪念日放假办法》（2024-11 修订）
#      元旦 1 天、春节 4 天（除夕起）、清明 1 天、劳动节 2 天、
#      端午 1 天、中秋 1 天、国庆 3 天，共 13 天。
#   2. 节日**日期** —— 天文事实。春节/元宵/端午/中秋是农历，清明是节气。
#      标准库没有农历，为了七个日期引一个农历库不划算（P5），所以查表。
#   3. **调休**补班 —— 行政决定。国务院办公厅每年一发的
#      《关于 YYYY 年部分节假日安排的通知》。**这不是天文事实，任何算法都推不出来。**
#
# 所以：`makeup_days` 在公告发布前一律留空（留空 = 不补班），
# 并给每个放假节日写上 note。核对该年公告后把 `confirmed` 改成 true。
#
# 逐条可信度用 `verified` 表示：
#   true  —— 公历固定日期 + 法条明确，不会变（元旦 / 劳动节 / 国庆）
#   false —— 农历或节气推算，**请按权威日历核对**（春节 / 清明 / 端午 / 中秋 / 元宵）
# 不放假的那几个（情人节 / 圣诞）verified = true：不放假是确定的。
#
# 修改本文件后跑 `python -m pytest tests/test_holiday_data.py -q` 校验结构。
# ────────────────────────────────────────────────────────────

confirmed = false

# 全年放假安排的核对状态说明，会显示在 `alterego holiday list` 上
note = "调休与连休区间待按国务院办公厅公告核对；农历/节气日期待按权威日历核对"

